# ============================================================
# Railway — deploy agent Part 6
#
#   cd 06-lab-complete
#   railway login && railway init
#   railway add --database redis             # (hoặc thêm Redis trong dashboard)
#   railway variables set AGENT_API_KEY=<chuỗi bí mật của bạn>
#   railway variables set REDIS_URL='${{Redis.REDIS_URL}}'   # trỏ tới service Redis
#   railway up && railway domain
#
# Railway tự cấp biến PORT; CMD trong Dockerfile đã nghe theo ${PORT:-8000}.
# Secret (AGENT_API_KEY, REDIS_URL) đặt trong dashboard / CLI, không ghi vào file này.
# ============================================================
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
