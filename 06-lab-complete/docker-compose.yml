# ============================================================
# agent + redis chỉ bằng một lệnh:  docker compose up --build
#
# Cấu hình: cp .env.example .env rồi đặt AGENT_API_KEY (không có .env vẫn chạy được,
# nhưng khi đó /ask từ chối mọi request vì chưa có API key).
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false           # không có file .env vẫn chạy được
    environment:
      # Ghi đè REDIS_URL từ .env: trong Compose, Redis là service tên "redis"
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
