# ============================================================
# Render Blueprint — agent Part 6 + Redis (Key Value)
#
# File này nằm trong thư mục con 06-lab-complete/ nên đường dẫn Dockerfile / context tính từ
# GỐC repo. Khi tạo Blueprint, chọn đúng file này (Blueprint path: 06-lab-complete/render.yaml).
# Secret không ghi thẳng giá trị: AGENT_API_KEY dùng generateValue (Render tự sinh chuỗi ngẫu nhiên;
# xem giá trị trong dashboard → Environment).
# ============================================================
services:
  - type: web
    name: ai-agent
    runtime: docker
    plan: free
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString

  - type: keyvalue
    name: agent-redis
    plan: free
    ipAllowList: []        # chỉ cho phép kết nối từ trong mạng nội bộ Render
    maxmemoryPolicy: allkeys-lru
